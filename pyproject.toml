[project]
name = "gpt-flow"
version = "0.1.0"
description = "High-performance, extensible async client and CLI for ChatGPT Web API with Clean Architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl_cffi>=0.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "aiofiles>=23.2.0",
    "playwright>=1.40.0",
]

[project.scripts]
gptflow = "gpt_flow.presentation.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpt_flow"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
